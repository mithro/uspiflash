[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "uspiflash"
dynamic = ["version"]
description = "Generates tiny single-file C libraries that detect SPI flash chips and report their capabilities, from the spiflash database."
readme = "README.md"
requires-python = ">=3.11"
# PEP 621 table form: Debian bookworm's hatchling 1.12 rejects PEP 639's
# `license = "Apache-2.0"` + `license-files` (as in spiflash).
license = { text = "Apache-2.0" }
authors = [{ name = "Tim Ansell", email = "me@mith.ro" }]
keywords = ["spi", "flash", "spi-nor", "spi-nand", "jedec", "sfdp", "embedded", "zephyr",
            "micropython", "litex", "code-generator"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Code Generators",
]
# The one runtime dependency: the database. Everything else is optional.
# 0.0.post74 is the minimum: it added the QEMU and Zephyr sources, SFDP
# dumps and suffix-group part names. The generated C's output is verified
# byte-identical to 0.0.post108, the newest release as of the last
# catch-up (uspiflash.VERIFIED_SPIFLASH).
dependencies = ["spiflash>=0.0.post74"]

[project.urls]
Homepage = "https://github.com/mithro/uspiflash"
Documentation = "https://uspiflash.readthedocs.io/"
Issues = "https://github.com/mithro/uspiflash/issues"

[project.scripts]
uspiflash = "uspiflash.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "pytest-cov>=5.0", "pytest-xdist>=3.6"]
docs = ["sphinx>=8", "furo>=2024.8", "myst-parser>=4", "sphinx-copybutton>=0.5",
        "types-docutils"]

# Rolling release, exactly as spiflash: X.Y at a vX.Y tag, X.Y.postN after.
[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "post-release"
local_scheme = "no-local-version"

[tool.hatch.build.hooks.vcs]
version-file = "src/uspiflash/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/uspiflash"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "tools/", "examples/", "experiments/", "docs/", "sizes/", "README.md",
           "LICENSE"]
# A local docs build writes these git-ignored directories under docs/; without
# excluding them, a local `uv build` (CI never has a docs build to sweep up)
# would put them in the sdist.
exclude = ["docs/_autosummary", "docs/_build"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Temporary directories go in the repository's git-ignored tmp/, never /tmp.
addopts = "-ra --cov=uspiflash --cov-report=term-missing --cov-fail-under=85 --basetemp=tmp/pytest"

[tool.ruff]
target-version = "py311"
src = ["src", "tests", "tools", "docs", "experiments"]
line-length = 100
extend-exclude = ["src/uspiflash/_version.py"]
# Each experiment's directory, and tools/qemu, is a script location, not a
# package (INP001): it has no __init__.py and is never imported by name.
# Every later experiment adds its directory here too (see
# experiments/README.md).
namespace-packages = [
    "docs/_ext",
    "experiments/2026-09-28-database-statistics",
    "experiments/2026-09-29-sfdp-vs-database",
    "tools/qemu",
]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
# spiflash's rule set, unchanged (see its pyproject.toml for the reasons).
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PT", "TC", "C4", "PIE", "RET", "N", "A",
    "ARG", "ISC", "PERF", "FURB", "PGH", "PTH", "ERA", "EM", "FBT", "SLF", "PLC", "PLE", "PLW",
    "T10", "YTT", "RSE", "G", "LOG", "BLE", "DTZ", "ICN", "INP", "TID", "FLY",
]

[tool.mypy]
# Not experiments/: every experiment's script is run.py, and mypy refuses two
# modules of one name in a run. tests/test_research.py checks each on its own.
files = ["src/uspiflash", "tests", "docs/conf.py", "docs/_ext", "tools/qemu"]
mypy_path = ["src"]
strict = true

[[tool.mypy.overrides]]
module = "uspiflash._version"
ignore_errors = true
