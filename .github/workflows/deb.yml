name: Debian packages

# Rolling release: every push to main tests, builds the packages for each
# suite and architecture, and republishes a signed flat apt repository per
# suite on GitHub Pages (https://mith.ro/uspiflash/<suite>/) through
# mithro/apt-repo-action. uspiflash-linux (the spidev tool) is built for
# amd64, i386, arm64, armhf and riscv64 (riscv64 from trixie on);
# python3-uspiflash is Architecture: all (pure Python), built once per suite
# by its amd64 job. A pull request runs the same tests and builds, and
# publishes nothing.
#
# A green run of this workflow on main is also what publishes to PyPI:
# publish-pypi.yml is triggered by it completing (workflow_run), so renaming
# this workflow breaks that trigger.
#
# This follows mithro/apt-repo-action's docs/packaging.md; the differences
# from its defaults are declared in .github/apt-packaging.toml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deb-${{ github.ref }}
  # A newer push to a pull request cancels the older build. On the default
  # branch a running publish is never cancelled: the newest push waits for it,
  # and replaces any older push still waiting (it contains that one's commits).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Two kinds of leg, and build-deb needs them all.
  #
  # The Python legs are the same gates as local development (ruff lint and
  # format, mypy --strict, pytest with coverage), across the supported
  # Pythons. The docs group is installed so mypy checks the documentation's
  # Sphinx extension too.
  #
  # The sizes leg checks that the size ledger (sizes/ledger.json) matches a
  # fresh measurement. The numbers only reproduce with the tools that made
  # them, so it runs in the environment the ledger is made in: Debian trixie
  # (linux/amd64) pinned by digest, with clang-19 and gcc installed from
  # snapshot.debian.org at a fixed timestamp, not the live mirror. The digest
  # and the timestamp must equal uspiflash.ledger.IMAGE and SNAPSHOT (a test
  # checks); RELEASING.md says how to bump them.
  # `measure --check` exits 2 if the tools' version lines differ from the
  # ledger's, and 1 (with a diff) if the sizes do.
  test:
    name: test (${{ matrix.python-version || 'sizes' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The sizes leg's image; the Python legs have none, and run on the runner.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        # Only `include`, so each entry is a leg of its own.
        include:
          - python-version: "3.11"
          - python-version: "3.12"
          - python-version: "3.13"
          - python-version: "3.14"
          - sizes: true
            container: debian:trixie@sha256:d5ce19d4736f0ebbacd686d1040271a5aeb0cc920f5990c1bfae1717627f0674
    steps:
      # git before checkout, so actions/checkout makes a real clone: hatch-vcs
      # derives the version from its history and tags.
      - name: Install the pinned tools
        if: matrix.sizes
        run: |
          rm -f /etc/apt/sources.list.d/debian.sources
          echo "deb http://snapshot.debian.org/archive/debian/20260918T000000Z/ trixie main" > /etc/apt/sources.list
          echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99snapshot
          apt-get update -q
          apt-get install -y -q --no-install-recommends \
            clang-19 lld-19 gcc libc6-dev python3 ca-certificates git

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so hatch-vcs can derive the version

      # The workspace belongs to the runner's user, not the container's root.
      - name: Trust the checkout
        if: matrix.sizes
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # The build generates debian/changelog: apt-repo-action's shared
      # scripts/deb-version.py writes the build's entry, with the version
      # derived from git. Committing a build's output would pin a stale
      # version (and name a commit that may not exist), so it must not be
      # tracked.
      - name: debian/changelog is not committed
        run: |
          git rev-parse --is-inside-work-tree
          if git ls-files --error-unmatch debian/changelog; then
            echo "::error file=debian/changelog::debian/changelog is committed, but the build generates it: git rm it"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v7

      - name: Install the matrix Python
        if: matrix.python-version
        run: uv python install ${{ matrix.python-version }}

      - name: Sync the dev and docs groups
        if: matrix.python-version
        run: uv sync --group dev --group docs --python ${{ matrix.python-version }}

      - name: Lint (ruff)
        if: matrix.python-version
        run: uv run ruff check

      - name: Format (ruff)
        if: matrix.python-version
        run: uv run ruff format --check

      - name: Type-check (mypy --strict)
        if: matrix.python-version
        run: uv run mypy

      - name: C compilers
        if: matrix.python-version
        run: gcc --version && clang --version

      # In parallel, as locally: run serially, spiflash 0.0.post182's larger
      # database took Python 3.11 and 3.12 past the 20-minute timeout.
      - name: Tests + coverage gate
        if: matrix.python-version
        run: uv run pytest -n auto

      - name: Tool versions
        if: matrix.sizes
        run: clang-19 --version && gcc --version

      - name: Check the size ledger
        if: matrix.sizes
        run: uv run uspiflash measure --check

  build-deb:
    name: build-deb (${{ matrix.suite }} ${{ matrix.arch }})
    needs: test
    # As apt-repo-action's reusable workflow (scripts/build-matrix.py) runs
    # them: amd64 and i386 natively on x86, arm64 natively on GitHub's arm64
    # runners, which also run armhf natively; riscv64 is emulated (QEMU), so
    # it is slower and debian/rules skips its tests.
    runs-on: ${{ (matrix.arch == 'arm64' || matrix.arch == 'armhf') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.arch == 'riscv64' && 60 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie, forky, sid]
        arch: [amd64, i386, arm64, armhf, riscv64]
        exclude:
          - {suite: bookworm, arch: riscv64}   # no official riscv64 in bookworm
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history + tags: the version is git describe's

      # The shared build: debian:<suite>, build deps from debian/control, and
      # the version from the shared deb-version.py (with ~deb<R>, and ~pr<P>
      # on a pull request). Writes the .debs to built-debs/. Only the amd64
      # job builds the Architecture: all python3-uspiflash too; the others
      # build only uspiflash-linux (dpkg-buildpackage -B), so no two jobs
      # make the same file.
      - name: Build
        id: build
        uses: mithro/apt-repo-action/build-deb@main
        with:
          suite: ${{ matrix.suite }}
          arch: ${{ matrix.arch }}
          arch-all: ${{ matrix.arch == 'amd64' }}

      # Install what was just built into a clean container of the same suite,
      # with its dependencies from the Debian archive, and run it. Once per
      # suite, in the amd64 job: it alone has both packages, and runs its
      # container natively.
      - name: Install test
        if: matrix.arch == 'amd64'
        env:
          SUITE: ${{ matrix.suite }}
          APT_SOURCES: ${{ steps.build.outputs.apt-sources }}
        run: |
          docker run --rm \
            -v "$APT_SOURCES:/apt-sources:ro" \
            -v "${PWD}/built-debs:/debs:ro" \
            -v "${PWD}/packaging:/packaging:ro" \
            "docker.io/library/debian:$SUITE" \
            sh -ec 'sh /apt-sources/install.sh
                    apt-get update -q
                    apt-get install -y -q --no-install-recommends /debs/*.deb gcc libc6-dev
                    sh /packaging/install-test.sh'

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: built-debs/*.deb
          retention-days: 14

  publish-apt:
    # Build and install-test pull requests, but never publish from one (or
    # from any branch but main): that would overwrite the live repository
    # with unreviewed packages.
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: build-deb
    # Scoped to this job alone. A job calling a reusable workflow sets the
    # maximum permissions available to it, so the elevated Pages scopes stay
    # here rather than applying to the whole workflow.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: mithro/apt-repo-action/.github/workflows/publish-apt.yml@main
    with:
      suites: "bookworm trixie forky sid"
      # No `architectures:` (deprecated): each suite's Release lists the
      # architectures its packages have.
      description: "uspiflash: tiny C libraries that detect SPI flash chips"
    secrets:
      gpg-private-key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
